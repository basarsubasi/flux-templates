apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: databases-sync
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/example-cluster-01/databases
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infra-sync
