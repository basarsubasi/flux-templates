apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 15m
  chart:
    spec:
      chart: cilium
      version: "1.15.x"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  values:
    # Example minimal values
    kubeProxyReplacement: true
    gatewayAPI:
      enabled: true
    hubble:
      relay:
        enabled: false
      ui:
        enabled: false
    # Enable Cilium Service Mesh mTLS/SPIFFE
    authentication:
      mutual:
        spiffe:
          enabled: false
