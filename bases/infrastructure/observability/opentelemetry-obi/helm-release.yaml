apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opentelemetry-obi
  namespace: monitoring
spec:
  interval: 15m
  chart:
    spec:
      chart: opentelemetry-ebpf-instrumentation
      version: "0.11.x"
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
  install:
    createNamespace: true
  values:
    # Example minimal dev values
    cluster_name: "example-cluster"
