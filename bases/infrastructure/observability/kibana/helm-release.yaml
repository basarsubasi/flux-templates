apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kibana
  namespace: monitoring
spec:
  interval: 15m
  chart:
    spec:
      chart: kibana
      version: "8.x.x"
      sourceRef:
        kind: HelmRepository
        name: elastic
        namespace: flux-system
  install:
    createNamespace: true
