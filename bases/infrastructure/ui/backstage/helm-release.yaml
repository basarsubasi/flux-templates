apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: backstage
  namespace: backstage
spec:
  interval: 15m
  chart:
    spec:
      chart: backstage
      version: "2.x.x"
      sourceRef:
        kind: HelmRepository
        name: backstage
        namespace: flux-system
  install:
    createNamespace: true
