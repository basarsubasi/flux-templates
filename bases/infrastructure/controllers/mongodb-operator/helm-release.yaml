apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: mongodb-kubernetes-operator
  namespace: mongodb-operator
spec:
  interval: 15m
  chart:
    spec:
      chart: mongodb-kubernetes-operator
      version: "0.x.x"
      sourceRef:
        kind: HelmRepository
        name: mongodb
        namespace: flux-system
  install:
    createNamespace: true
